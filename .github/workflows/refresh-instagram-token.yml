name: Keep the Instagram connection alive

# Instagram access tokens expire, so this renews it every two weeks and saves the
# new one back into the repository's secrets. Needs two secrets:
#   IG_ACCESS_TOKEN  - the Instagram token
#   SECRETS_WRITER   - a fine-grained GitHub token for this repository with "Secrets: read and write"

on:
  schedule:
    - cron: "41 14 1,15 * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Renew the token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.SECRETS_WRITER }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$IG_ACCESS_TOKEN" ] || [ -z "$GH_TOKEN" ]; then echo "Instagram not connected yet; nothing to renew."; exit 0; fi
          NEW=$(curl -sf "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${IG_ACCESS_TOKEN}" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("access_token",""))')
          if [ -z "$NEW" ]; then echo "::error::Instagram did not renew the token. Reconnect Instagram."; exit 1; fi
          echo "::add-mask::$NEW"
          gh secret set IG_ACCESS_TOKEN --repo "$REPO" --body "$NEW"
          echo "Token renewed."
